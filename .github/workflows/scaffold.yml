name: iOS build and launch
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify pinned provider download
        env:
          EMBLA_LIVE_DOWNLOAD_TESTS: "1"
        run: swift test --force-resolved-versions --filter livePinnedConfigDownload
      - name: Build device target and test simulator launch
        run: ./scripts/check.sh
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-build-and-test-results
          path: |
            build/*.log
            build/test-run.*/Scaffold.xcresult
          if-no-files-found: error
          retention-days: 7
