name: Scaffold launch
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Resolve pinned runtime
        run: xcodebuild -resolvePackageDependencies -project EmblaChat.xcodeproj -scheme EmblaChat
      - name: Launch scaffold in simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl create EmblaScaffold com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcodebuild test -project EmblaChat.xcodeproj -scheme EmblaChat \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Scaffold.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-results
          path: build/Scaffold.xcresult
          if-no-files-found: warn
          retention-days: 7
