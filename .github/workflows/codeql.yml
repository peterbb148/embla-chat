name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-15
            build-mode: manual
          - language: actions
            runner: ubuntu-24.04
            build-mode: none
          - language: python
            runner: ubuntu-24.04
            build-mode: none
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Resolve locked Swift dependencies
        if: matrix.language == 'swift'
        run: |
          xcodebuild -resolvePackageDependencies -project EmblaChat.xcodeproj \
            -scheme EmblaChat -onlyUsePackageVersionsFromResolvedFile
      - uses: github/codeql-action/init@38112626f97ac1fd7acf3df7ebca51f4677c1b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build actual iPhone application for Swift extraction
        if: matrix.language == 'swift'
        run: |
          xcodebuild build -project EmblaChat.xcodeproj -scheme EmblaChat \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/CodeQLDerivedData \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  security-inventory:
    name: Security inventory
    if: ${{ always() }}
    needs: [analyze]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Require completed analysis jobs
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
        run: test "$ANALYSIS_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test whole-head and baseline failure paths
        run: python3 -m unittest discover -s scripts -p test_codeql_inventory.py
      - name: Require clean full final-head results and reconcile main findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_codeql_inventory.py
