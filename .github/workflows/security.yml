name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test fail-closed dependency completeness guard
        run: python3 -m unittest discover -s scripts -p test_dependency_snapshot.py
      # The initial commit contains only README.md: comparing against it audits the
      # complete proposed dependency graph, including an unchanged vulnerable baseline.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: '240ad61445b4d7f9c39a354ec6661d036cc315a8'
          head-ref: ${{ github.sha }}
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          vulnerability-check: true
          license-check: false
          warn-only: false
          comment-summary-in-pr: never
          show-openssf-scorecard: false
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
      - name: Reject unresolved snapshot warnings and incomplete head data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_dependency_snapshot.py
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Verify scanner enforcement with disposable synthetic history
        run: bash scripts/check-secret-scanner.sh "$RUNNER_TEMP/gitleaks"
      - name: Scan full history without exposing secret values
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --exit-code=1 --log-opts="--all -m" .'
